m attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="11s" repeatCount="indefinite"/><animate attributeName="opacity" values=".05;.2;.05" dur="8.2s" repeatCount="indefinite"/></text><text x="770" y="176" font-size="11" fill="#e6edf3" opacity=".10">&amp;&amp;<animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values=".05;.2;.05" dur="9.0s" repeatCount="indefinite"/></text><text x="560" y="120" font-size="14" fill="#e6edf3" opacity=".10">λ<animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="13s" repeatCount="indefinite"/><animate attributeName="opacity" values=".05;.2;.05" dur="9.8s" repeatCount="indefinite"/></text><text x="380" y="100" font-size="12" fill="#e6edf3" opacity=".10">::<animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="14s" repeatCount="indefinite"/><animate attributeName="opacity" values=".05;.2;.05" dur="10.6s" repeatCount="indefinite"/></text><text x="840" y="130" font-size="11" fill="#e6edf3" opacity=".10">#!<animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="15s" repeatCount="indefinite"/><animate attributeName="opacity" values=".05;.2;.05" dur="11.4s" repeatCount="indefinite"/></text></g><g font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace"><g transform="translate(735 100)"><circle r="86" fill="none" stroke="#e6edf3" stroke-opacity=".10" stroke-dasharray="2 7"><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="50s" repeatCount="indefinite"/></circle><circle r="60" fill="none" stroke="#00e5ff" stroke-opacity=".25" stroke-dasharray="14 8"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/></circle><circle r="36" fill="none" stroke="#b388ff" stroke-opacity=".30"/><g><anim